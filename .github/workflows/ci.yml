name: ProjectHub AI CI

on:
  push:
    branches: [ main, fix/vong-4 ]
  pull_request:
    branches: [ main, fix/vong-4 ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: projecthub_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Linters & Security Checks
        run: |
          python manage.py check
          python manage.py check --deploy
          python manage.py makemigrations --check
          pyflakes .
          python scripts/check_secrets.py
          python scripts/lint_enums.py
          python scripts/lint_views.py
          python scripts/lint_templates.py
          python scripts/lint_ai_prompts.py

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/projecthub_db
          DJANGO_SECRET_KEY: ci-secret-key-testing-only-12345
          DJANGO_DEBUG: "True"
          SEED_DEMO: "1"
        run: |
          python manage.py migrate
          coverage run manage.py test ai_assistant.tasks
          coverage report
