{% comment %}
Reusable Modal Backdrop Wrapper Component
Usage in template:
<div x-data="{ open: false }">
    ...
    {% include "includes/_modal.html" with modal_id="myModal" title="Tiêu đề modal" body_template="..." %}
</div>
{% endcomment %}
<div x-show="{{ show_binding|default:'open' }}"
     x-cloak
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm">
    <div @click.away="{{ show_binding|default:'open' }} = false"
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="opacity-0 scale-95 translate-y-2"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="opacity-100 scale-100 translate-y-0"
         x-transition:leave-end="opacity-0 scale-95 translate-y-2"
         class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4 relative">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <h3 class="text-base font-bold text-slate-900 tracking-tight flex items-center space-x-2">
                {% if modal_icon %}<i class="fa-solid {{ modal_icon }} text-accent-primary"></i>{% endif %}
                <span>{{ modal_title|default:"Thông báo" }}</span>
            </h3>
            <button @click="{{ show_binding|default:'open' }} = false" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>
        </div>
        <div class="text-xs text-slate-600 leading-relaxed">
            {{ modal_content|safe }}
        </div>
    </div>
</div>
