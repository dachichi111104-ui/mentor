<!-- Global Alpine.js Toast Notification Container -->
<div x-data
     class="fixed top-4 right-4 z-[9999] flex flex-col space-y-2.5 max-w-sm w-full pointer-events-none">
    <template x-for="toast in $store.toast.items" :key="toast.id">
        <div x-show="toast.show"
             x-transition:enter="transition ease-out duration-300 transform"
             x-transition:enter-start="opacity-0 translate-y-[-10px] scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 scale-100"
             x-transition:leave="transition ease-in duration-200 transform"
             x-transition:leave-start="opacity-100 translate-y-0 scale-100"
             x-transition:leave-end="opacity-0 translate-y-[-10px] scale-95"
             class="pointer-events-auto p-4 rounded-2xl border text-xs font-semibold shadow-xl flex items-start justify-between space-x-3 backdrop-blur-md"
             :class="{
                 'bg-emerald-900/90 border-emerald-700 text-emerald-100': toast.type === 'success',
                 'bg-rose-900/90 border-rose-700 text-rose-100': toast.type === 'error',
                 'bg-amber-900/90 border-amber-700 text-amber-100': toast.type === 'warning',
                 'bg-[#163B65]/90 border-slate-700 text-slate-100': toast.type === 'info' || !toast.type
             }">
            <div class="flex items-start space-x-2.5">
                <i class="fa-solid text-sm mt-0.5"
                   :class="{
                       'fa-circle-check text-emerald-400': toast.type === 'success',
                       'fa-circle-exclamation text-rose-400': toast.type === 'error',
                       'fa-triangle-exclamation text-amber-400': toast.type === 'warning',
                       'fa-circle-info text-blue-400': toast.type === 'info' || !toast.type
                   }"></i>
                <div class="space-y-0.5">
                    <p x-text="toast.title" class="font-bold text-[13px] leading-snug"></p>
                    <p x-text="toast.message" class="text-[11px] opacity-90 leading-relaxed"></p>
                </div>
            </div>
            <button @click="$store.toast.remove(toast.id)" class="opacity-60 hover:opacity-100 p-0.5">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>
        </div>
    </template>
</div>
