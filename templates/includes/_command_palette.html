<!-- Command Palette Modal (Ctrl+K / Cmd+K) -->
<div x-data="{
        open: false,
        query: '',
        results: { projects: [], tasks: [], members: [], documents: [] },
        loading: false,
        selectedIndex: 0,
        performSearch() {
            if (this.query.trim().length < 2) {
                this.results = { projects: [], tasks: [], members: [], documents: [] };
                return;
            }
            this.loading = true;
            fetch('/api/v1/global-search-json/?q=' + encodeURIComponent(this.query))
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success') {
                        this.results = data.results;
                    }
                    this.loading = false;
                })
                .catch(() => { this.loading = false; });
        }
     }"
     @keydown.window.cmd.k.prevent="open = true; $nextTick(() => $refs.searchInput.focus())"
     @keydown.window.ctrl.k.prevent="open = true; $nextTick(() => $refs.searchInput.focus())"
     @open-command-palette.window="open = true; $nextTick(() => $refs.searchInput.focus())"
     x-show="open"
     x-cloak
     class="fixed inset-0 z-[999] p-4 sm:p-6 md:p-20 overflow-y-auto bg-slate-950/60 backdrop-blur-sm flex items-start justify-center">

    <div @click.away="open = false"
         x-show="open"
         x-transition:enter="transition ease-out duration-200 transform"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-150 transform"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="bg-white rounded-3xl max-w-2xl w-full shadow-2xl border border-slate-200 overflow-hidden text-xs">
        
        <!-- Search Input Header -->
        <div class="p-4 border-b border-slate-100 flex items-center space-x-3 bg-slate-50/50">
            <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm"></i>
            <input x-ref="searchInput"
                   type="text"
                   x-model="query"
                   @input.debounce.250ms="performSearch()"
                   placeholder="Tìm đồ án, công việc, thành viên, tài liệu... (Nhấn ESC để đóng)"
                   class="w-full bg-transparent border-none text-slate-900 placeholder-slate-400 text-sm focus:outline-none font-medium">
            <template x-if="loading">
                <i class="fa-solid fa-circle-notch fa-spin text-accent-primary"></i>
            </template>
            <span class="px-2 py-1 bg-slate-200 text-slate-600 rounded-lg text-[10px] font-mono font-bold uppercase">ESC</span>
        </div>

        <!-- Results Container -->
        <div class="max-h-[60vh] overflow-y-auto p-4 custom-scrollbar space-y-4">
            <!-- Initial Tip -->
            <template x-if="query.trim().length < 2">
                <div class="py-8 text-center text-slate-400 space-y-2">
                    <i class="fa-solid fa-keyboard text-2xl text-slate-300"></i>
                    <p class="text-xs">Nhập từ khóa tìm kiếm (tối thiểu 2 ký tự)...</p>
                    <div class="flex justify-center space-x-2 text-[10px] pt-2">
                        <span class="px-2 py-1 bg-slate-100 rounded-md border text-slate-500">Mã đồ án</span>
                        <span class="px-2 py-1 bg-slate-100 rounded-md border text-slate-500">Tên task</span>
                        <span class="px-2 py-1 bg-slate-100 rounded-md border text-slate-500">Sinh viên / Mentor</span>
                    </div>
                </div>
            </template>

            <!-- Projects Results -->
            <template x-if="results.projects && results.projects.length > 0">
                <div class="space-y-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block px-2">Đồ án (Projects)</span>
                    <template x-for="p in results.projects" :key="p.id">
                        <a :href="p.url" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-100 transition-colors group">
                            <div class="flex items-center space-x-2.5">
                                <span class="px-2 py-0.5 bg-[#163B65]/10 text-accent-primary font-mono font-bold text-[10px] rounded" x-text="p.code"></span>
                                <span class="font-bold text-slate-900 group-hover:text-accent-primary" x-text="p.name"></span>
                            </div>
                            <span class="text-[10px] text-slate-400" x-text="p.category"></span>
                        </a>
                    </template>
                </div>
            </template>

            <!-- Tasks Results -->
            <template x-if="results.tasks && results.tasks.length > 0">
                <div class="space-y-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block px-2">Công việc (Tasks)</span>
                    <template x-for="t in results.tasks" :key="t.id">
                        <a :href="t.url" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-100 transition-colors group">
                            <div class="flex items-center space-x-2.5">
                                <i class="fa-solid fa-list-check text-slate-400"></i>
                                <span class="font-semibold text-slate-800 group-hover:text-accent-primary" x-text="t.title"></span>
                            </div>
                            <span class="px-2 py-0.5 rounded text-[9px] font-bold uppercase" :class="t.priority_class" x-text="t.status"></span>
                        </a>
                    </template>
                </div>
            </template>

            <!-- Members Results -->
            <template x-if="results.members && results.members.length > 0">
                <div class="space-y-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block px-2">Thành viên / Mentor</span>
                    <template x-for="m in results.members" :key="m.id">
                        <a :href="m.url" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-100 transition-colors group">
                            <div class="flex items-center space-x-2.5">
                                <img :src="m.avatar" class="w-6 h-6 rounded-full object-cover">
                                <span class="font-bold text-slate-800 group-hover:text-accent-primary" x-text="m.name"></span>
                            </div>
                            <span class="text-[10px] text-slate-500 font-semibold" x-text="m.role"></span>
                        </a>
                    </template>
                </div>
            </template>

            <!-- Documents Results -->
            <template x-if="results.documents && results.documents.length > 0">
                <div class="space-y-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block px-2">Tài liệu (Documents)</span>
                    <template x-for="d in results.documents" :key="d.id">
                        <a :href="d.url" class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-100 transition-colors group">
                            <div class="flex items-center space-x-2.5">
                                <i class="fa-solid fa-file-lines text-slate-400"></i>
                                <span class="font-semibold text-slate-800 group-hover:text-accent-primary" x-text="d.title"></span>
                            </div>
                            <span class="text-[10px] text-slate-400" x-text="d.file_type"></span>
                        </a>
                    </template>
                </div>
            </template>

            <!-- No Results -->
            <template x-if="query.trim().length >= 2 && !loading && !results.projects.length && !results.tasks.length && !results.members.length && !results.documents.length">
                <div class="py-8 text-center text-slate-400">
                    Không tìm thấy kết quả phù hợp cho "<span x-text="query" class="font-bold"></span>"
                </div>
            </template>
        </div>

        <!-- Footer Shortcuts Info -->
        <div class="p-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500">
            <div class="flex items-center space-x-3">
                <span><kbd class="px-1.5 py-0.5 bg-white rounded border font-mono">Ctrl+K</kbd> Mở Command Palette</span>
                <span><kbd class="px-1.5 py-0.5 bg-white rounded border font-mono">ESC</kbd> Đóng</span>
            </div>
            <span class="font-semibold text-accent-primary">ProjectHub Search</span>
        </div>
    </div>
</div>
