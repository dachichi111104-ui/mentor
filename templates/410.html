{% extends "layouts/base.html" %}

{% block title %}410 Tệp tin đã bị xóa - ProjectHub{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center p-6">
    <div class="max-w-md w-full text-center space-y-5 bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold border border-amber-200">
            410
        </div>
        <h1 class="text-xl font-bold text-slate-900">Tệp tin không còn tồn tại</h1>
        <p class="text-xs text-slate-500 leading-relaxed">
            {{ message|default:"Tài liệu hoặc tệp tin bạn truy cập đã bị xóa hoặc không còn tồn tại trên hệ thống lưu trữ." }}
        </p>
        <div class="pt-2">
            <a href="javascript:history.back()" class="inline-flex items-center justify-center px-4 py-2 bg-[#163B65] text-white text-xs font-bold rounded-xl hover:bg-navy-900 transition-colors">
                <i class="fa-solid fa-arrow-left mr-2"></i> Quay lại
            </a>
        </div>
    </div>
</div>
{% endblock %}
