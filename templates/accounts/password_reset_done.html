<!DOCTYPE html>
<html lang="vi" class="h-full bg-[#F7F8FA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đã gửi Yêu cầu Khôi phục Mật khẩu - ProjectHub AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#163B65', 950: '#0f2643' },
                        academic: { bg: '#F7F8FA', text: '#172033', border: '#E4E7EC', gold: '#B58A3A' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="h-full flex items-center justify-center p-4 antialiased font-sans">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-slate-200 p-8 space-y-6 text-center">
        <div class="w-14 h-14 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-600 text-2xl mx-auto border border-emerald-200">
            <i class="fa-solid fa-paper-plane"></i>
        </div>
        <h2 class="text-xl font-bold text-navy-900 tracking-tight">Kiểm tra Hộp thư Email</h2>
        <p class="text-xs text-slate-600 leading-relaxed">
            Hướng dẫn khôi phục mật khẩu đã được gửi đến email của bạn. Vui lòng kiểm tra liên kết được gửi kèm để tạo mật khẩu mới.
        </p>
        <div class="pt-4 border-t border-slate-100">
            <a href="{% url 'login' %}" class="inline-flex items-center space-x-2 text-xs font-bold text-navy-900 hover:underline">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Quay lại Đăng nhập</span>
            </a>
        </div>
    </div>
</body>
</html>
