services:
  # 1. Main Web Application Service (Render Free Plan compatible)
  - type: web
    name: projecthub-ai-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: projecthub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: projecthub-redis
          property: connectionString

  # 2. Redis Instance (Cache, Celery Broker & Channels Layer)
  - type: redis
    name: projecthub-redis
    plan: free
    ipAllowList: []

databases:
  # 3. Production PostgreSQL Instance
  - name: projecthub-db
    plan: free
    databaseName: projecthub_db
    user: projecthub_user
